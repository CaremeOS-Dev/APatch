# Single source of the manager version code: epoch + git commit count.
# Read by build.gradle.kts, apd/build.rs and .github/workflows/build.yml.
# (Also valid shell syntax, so CI can source this file directly.)
#
# The epoch carries a one-time offset for this fork. Before the XTC history was
# squashed into main, the arm32 builds were published from a long-lived branch
# whose commit count was higher than main's, so upstream's 10200 now yields
# 11288 on main -- below the 11294 that is already installed on test devices.
# 10200 + 7 keeps the codes monotonic with what has shipped (11296 for the
# first release built from main) and leaves room to rebase onto upstream again
# without ever going backwards.
managerVersionEpoch=10207
